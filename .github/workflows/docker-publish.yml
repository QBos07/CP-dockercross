name: Docker

on:
  schedule:
    - cron: '4 2 1 */2 *'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  metadata:
    runs-on: ubuntu-latest

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}

    steps:
      - uses: actions/checkout@v7

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

  build:
    name: Build (${{ matrix.arch }})
    needs: metadata

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            platform: linux/amd64

          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    outputs:
      digest-amd64: ${{ steps.digest.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.digest.outputs.digest-arm64 }}

    steps:
      - uses: actions/checkout@v7

      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}

          push: ${{ github.event_name != 'pull_request' }}

          labels: ${{ fromJson(needs.metadata.outputs.json).labels }}

          no-cache: ${{ github.event_name == 'schedule' }}

          outputs: |
            type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - id: digest
        if: github.event_name != 'pull_request'
        run: |
          echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish multi-arch image

    if: github.event_name != 'pull_request'

    needs:
      - metadata
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4

      - name: Create manifest
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          ARM64: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          while read TAG; do
            docker buildx imagetools create \
              -t "$TAG" \
              "$IMAGE@$AMD64" \
              "$IMAGE@$ARM64"
          done <<< "$TAGS"

      - name: Sign published images
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          while read TAG; do
            DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
            cosign sign --yes "$TAG@$DIGEST"
          done <<< "$TAGS"
