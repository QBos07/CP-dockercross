name: Docker

on:
  schedule:
    - cron: '4 2 1 */2 *'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  metadata:
    runs-on: ubuntu-latest

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
      image-name: ${{ steps.image-name.outputs.image-name }}

    steps:
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - id: image-name
        run: |
          echo "image-name=$(echo '${{ steps.meta.outputs.tags[0] }}' | sed 's/:[^:]*$//')" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: metadata

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            platform: linux/amd64

          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write
      actions: read

    outputs:
      json: ${{ steps.matrix-output.outputs.json }}

    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}

          labels: ${{ needs.metadata.outputs.labels }}

          no-cache: ${{ github.event_name == 'schedule' }}

          outputs: |
            type=image,name=${{ needs.metadata.outputs.image-name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - uses: beacon-biosignals/matrix-output@v1
        id: matrix-output
        with:
          yaml: |
            arch: ${{ matrix.arch }}
            digest: ${{ steps.build.outputs.digest }}
            image: ${{ needs.metadata.outputs.image-name }}@${{ steps.build.outputs.digest }}
            

  publish:
    name: Publish multi-arch image

    if: github.event_name != 'pull_request'

    needs:
      - metadata
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4

      - name: Create manifest
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
          IMAGES: ${{ fromJson(needs.build.outputs.json).*.image }}
        run: |
          while read TAG; do
            docker buildx imagetools create \
              -t "$TAG" \
              "$IMAGES"
          done <<< "$TAGS"

      - name: Sign published images
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          while read TAG; do
            DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
            cosign sign --yes "$TAG@$DIGEST"
          done <<< "$TAGS"
